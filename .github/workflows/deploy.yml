name: Deploy

# Builds the site, runs the checks, and publishes the output to the root of
# the gh-pages branch. GitHub Pages must be set to "Deploy from a branch"
# (gh-pages, / root). See README.md.

on:
  push:
    branches: [main]
  # Rebuild once a day, so a new or changed project manifest on GitHub
  # appears without a push to this repository (FR-11).
  schedule:
    - cron: "23 4 * * *"
  # Adds a "Run workflow" button under Actions > Deploy for an immediate rebuild.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The token GitHub gives this run lets the build read the project
      # manifests without the anonymous rate limit. It is not stored anywhere.
      - name: Validate content, build, validate HTML, check internal links
        run: npm run check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Second link check with lychee. It does not block the deploy until it
      # has been seen to pass on GitHub; remove "fail: false" after that.
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './_site/**/*.html'
          fail: false

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          # Keep pull request previews when the production site is replaced.
          clean-exclude: pr-preview/
          force: false
