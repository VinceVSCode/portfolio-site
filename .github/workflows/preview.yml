name: Deploy PR previews

# Publishes each pull request to gh-pages under pr-preview/pr-<number>/,
# comments the link on the pull request, and removes the preview when the
# pull request is closed or merged (FR-8). The production site is not changed.
# Pull requests from forks are not supported by the preview action.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      # PREVIEW=1 adds <meta name="robots" content="noindex"> to every page.
      - name: Validate content, build, validate HTML, check internal links
        if: github.event.action != 'closed'
        run: npm run check
        env:
          PREVIEW: "1"

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
